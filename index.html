<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mirage_Rover · OI Blog</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* ========== OI深色主题 ========== */
    :root {
      --bg: #0f1419;
      --surface: #1a212b;
      --surface-hover: #212b36;
      --border: #2c3643;
      --text: #d6e1f0;
      --text-secondary: #9aa8bc;
      --accent: #4f9cf7;
      --accent-soft: #1e3a5f;
      --green: #5cb87a;
      --red: #e06c75;
      --code-bg: #0b0f14;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      --transition: 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.65;
      padding: 1.2rem 1rem 2rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .blog-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    .site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      cursor: pointer;
      user-select: none;
    }
    .logo-icon { font-size: 2rem; }
    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
    }
    .logo-text span { color: var(--accent); }
    .logo-text em {
      font-style: normal;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      font-size: 0.7em;
      margin-left: 6px;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: color var(--transition);
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a.active { color: var(--accent); font-weight: 600; }

    .btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
      display: inline-block;
      user-select: none;
    }
    .btn:hover { opacity: 0.85; }
    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--text-secondary); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }
    .btn-danger:hover { background: var(--red); color: white; }

    .config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
      display: none;
    }
    .config-panel.active { display: block; }
    .config-panel h2 { margin-bottom: 1rem; color: var(--accent); }
    .config-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .config-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      min-width: 200px;
    }
    .config-row input:focus { outline: none; border-color: var(--accent); }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(270px, 1fr);
      gap: 1.8rem;
      align-items: start;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .post-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .post-card:hover {
      border-color: #3a4a5e;
      background: var(--surface-hover);
      box-shadow: var(--shadow);
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1rem;
      margin-bottom: 0.8rem;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      background: #2a3f55;
      color: #7fb3e8;
    }
    .post-date { font-size: 0.8rem; color: var(--text-secondary); }
    .post-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .post-excerpt { color: var(--text-secondary); font-size: 0.95rem; }

    .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    .sidebar-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 1px solid var(--border);
    }
    .sidebar-card h3 { margin-bottom: 1rem; }
    .author-box { text-align: center; }
    .avatar {
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, #1e3a5f, #2c4a6e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 0.8rem;
    }
    .author-name { font-weight: 700; font-size: 1.2rem; }
    .author-desc { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; }

    .post-detail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .post-detail h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    .markdown-body { margin-top: 1.5rem; line-height: 1.8; }
    .markdown-body pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }
    .markdown-body code {
      background: var(--code-bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .markdown-body pre code { background: none; padding: 0; }

    .editor {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .editor input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .editor textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      min-height: 300px;
      resize: vertical;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      line-height: 1.6;
    }
    .editor input:focus, .editor textarea:focus { outline: none; border-color: var(--accent); }

    .hidden { display: none; }
    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .error-msg { background: #2d1518; border: 1px solid var(--red); color: #ffb3b3; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .success-msg { background: #12261e; border: 1px solid var(--green); color: #7ee2a8; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .site-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
    @media (max-width: 500px) {
      .post-card { padding: 1.2rem; }
      .post-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="blog-container">
    <!-- 配置面板 -->
    <div class="config-panel" id="configPanel">
      <h2>⚙️ 博客配置</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1rem;">配置 GitHub 仓库信息以启用云端存储</p>
      <div class="config-row">
        <input type="text" id="configOwner" placeholder="GitHub 用户名 (如 User-dusttle)">
      </div>
      <div class="config-row">
        <input type="text" id="configRepo" placeholder="仓库名 (如 Blog)">
      </div>
      <div class="config-row">
        <input type="password" id="configToken" placeholder="GitHub Token (需要 repo 权限)">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn" id="saveConfigBtn">💾 保存配置</button>
        <button class="btn btn-secondary" id="cancelConfigBtn">取消</button>
      </div>
    </div>

    <!-- 头部 -->
    <header class="site-header">
      <div class="logo-area" id="logoBtn">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Mirage<span>_Rover</span> <em>OI Blog</em></span>
      </div>
      <nav class="nav-links">
        <a id="homeBtn" class="active">🏠 首页</a>
        <a id="newPostNavBtn">📝 写文章</a>
        <a id="settingsNavBtn">⚙️ 设置</a>
      </nav>
    </header>

    <!-- 消息区域 -->
    <div id="messageArea"></div>

    <!-- 主内容区 -->
    <div class="main-grid">
      <main class="post-list" id="postList">
        <div class="loading">加载中...</div>
      </main>
      <aside class="sidebar">
        <div class="sidebar-card">
          <div class="author-box">
            <div class="avatar">🧑‍💻</div>
            <div class="author-name">Mirage_Rover</div>
            <p class="author-desc">OIer / 算法竞赛选手<br>分享题解与学习笔记</p>
          </div>
        </div>
        <div class="sidebar-card">
          <h3>📂 关于</h3>
          <p style="color: var(--text-secondary); font-size: 0.9rem;">
            基于 GitHub Issues 的云端 OI 博客。<br>
            文章存储在您的 GitHub 仓库中。
          </p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let config = {
      owner: localStorage.getItem('oi_blog_owner') || '',
      repo: localStorage.getItem('oi_blog_repo') || '',
      token: localStorage.getItem('oi_blog_token') || ''
    };
    const GITHUB_API = 'https://api.github.com';
    const LABEL_PREFIX = 'blog-post';

    // ==================== 工具函数 ====================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showMessage(type, message) {
      const area = document.getElementById('messageArea');
      const cls = type === 'error' ? 'error-msg' : 'success-msg';
      area.innerHTML = '<div class="' + cls + '">' + escapeHtml(message) + '</div>';
      setTimeout(function() { area.innerHTML = ''; }, 3000);
    }

    function renderMarkdown(text) {
      if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        return marked.parse(text);
      }
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    function isConfigured() {
      return config.owner !== '' && config.repo !== '' && config.token !== '';
    }

    // ==================== 配置管理 ====================
    function showConfig() {
      document.getElementById('configPanel').classList.add('active');
      document.getElementById('configOwner').value = config.owner;
      document.getElementById('configRepo').value = config.repo;
      document.getElementById('configToken').value = config.token;
    }

    function hideConfig() {
      document.getElementById('configPanel').classList.remove('active');
    }

    function saveConfig() {
      config.owner = document.getElementById('configOwner').value.trim();
      config.repo = document.getElementById('configRepo').value.trim();
      config.token = document.getElementById('configToken').value.trim();
      
      if (!config.owner || !config.repo || !config.token) {
        showMessage('error', '请填写完整信息');
        return;
      }
      
      localStorage.setItem('oi_blog_owner', config.owner);
      localStorage.setItem('oi_blog_repo', config.repo);
      localStorage.setItem('oi_blog_token', config.token);
      hideConfig();
      showMessage('success', '配置已保存');
      loadPosts();
    }

    // ==================== GitHub API ====================
    async function githubRequest(method, endpoint, body) {
      if (!isConfigured()) {
        throw new Error('请先配置 GitHub 信息');
      }
      var url = GITHUB_API + endpoint;
      var headers = {
        'Authorization': 'token ' + config.token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };
      var options = { method: method, headers: headers };
      if (body) options.body = JSON.stringify(body);
      
      var response = await fetch(url, options);
      if (response.status === 204) return null;
      if (!response.ok) {
        var errData = await response.json().catch(function() { return {}; });
        throw new Error(errData.message || 'GitHub API 错误: ' + response.status);
      }
      return response.json();
    }

    // ==================== 文章加载 ====================
    async function loadPosts() {
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">加载中...</div>';
      
      if (!isConfigured()) {
        listEl.innerHTML = '<div class="loading"><p style="margin-bottom:1rem;">👋 欢迎使用 OI Blog</p><p style="font-size:0.9rem;margin-bottom:1rem;">请先配置 GitHub 信息</p><button class="btn" id="startConfigBtn">⚙️ 开始配置</button></div>';
        document.getElementById('startConfigBtn').addEventListener('click', showConfig);
        return;
      }
      
      try {
        var issues = await githubRequest('GET', '/repos/' + config.owner + '/' + config.repo + '/issues?state=open&labels=' + LABEL_PREFIX + '&per_page=100');
        
        var validIssues = issues.filter(function(issue) {
          return issue.state === 'open' && issue.labels.some(function(label) { return label.name === LABEL_PREFIX; });
        });
        
        if (validIssues.length === 0) {
          listEl.innerHTML = '<div class="loading">暂无文章</div>';
          return;
        }
        
        listEl.innerHTML = validIssues.map(function(issue) {
          var preview = issue.body ? issue.body.replace(/```[\s\S]*?```/g, '[代码]').replace(/[#>*`\n]/g, ' ').slice(0, 180) + '...' : '';
          return '<article class="post-card" data-issue="' + issue.number + '">' +
            '<div class="post-meta"><span class="badge">#' + issue.number + '</span>' +
            '<span class="post-date">📅 ' + new Date(issue.created_at).toLocaleDateString('zh-CN') + '</span></div>' +
            '<h2 class="post-title">' + escapeHtml(issue.title) + '</h2>' +
            '<p class="post-excerpt">' + escapeHtml(preview) + '</p></article>';
        }).join('');
        
        document.querySelectorAll('.post-card').forEach(function(card) {
          card.addEventListener('click', function() {
            showPost(this.getAttribute('data-issue'));
          });
        });
      } catch (error) {
        listEl.innerHTML = '<div class="error-msg">' + escapeHtml(error.message) + '</div>';
      }
    }

    // ==================== 文章详情 ====================
    async function showPost(issueNumber) {
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">加载文章...</div>';
      
      try {
        var issue = await githubRequest('GET', '/repos/' + config.owner + '/' + config.repo + '/issues/' + issueNumber);
        var content = renderMarkdown(issue.body || '');
        
        listEl.innerHTML = '<div class="post-detail">' +
          '<button class="btn btn-secondary" id="backBtn">← 返回列表</button>' +
          '<h1>' + escapeHtml(issue.title) + '</h1>' +
          '<div class="post-meta" style="margin-bottom:1.5rem;">' +
          '<span class="badge">#' + issue.number + '</span>' +
          '<span class="post-date">📅 ' + new Date(issue.created_at).toLocaleDateString('zh-CN') + '</span></div>' +
          '<div class="markdown-body">' + content + '</div>' +
          '<div style="margin-top:2rem;display:flex;gap:0.8rem;">' +
          '<button class="btn btn-secondary" id="editBtn">✏️ 编辑</button>' +
          '<button class="btn btn-danger" id="deleteBtn">🗑️ 删除</button></div></div>';
        
        document.getElementById('backBtn').addEventListener('click', loadPosts);
        document.getElementById('editBtn').addEventListener('click', function() { editPost(issueNumber); });
        document.getElementById('deleteBtn').addEventListener('click', function() { deletePost(issueNumber, issue.title); });
      } catch (error) {
        listEl.innerHTML = '<div class="error-msg">' + escapeHtml(error.message) + '</div>';
      }
    }

    // ==================== 编辑器 ====================
    function showEditor(issueNumber, existingData) {
      var listEl = document.getElementById('postList');
      var isEdit = issueNumber !== null && issueNumber !== undefined;
      
      var titleValue = existingData ? escapeHtml(existingData.title) : '';
      var contentValue = existingData ? escapeHtml(existingData.body) : '';
      
      var placeholderText = '支持 Markdown 语法。例如：代码块用三个反引号包裹';
      
      listEl.innerHTML = '<div class="editor">' +
        '<h2 style="margin-bottom:1rem;">' + (isEdit ? '✏️ 编辑文章 #' + issueNumber : '✏️ 撰写新文章') + '</h2>' +
        '<input type="text" id="editTitle" placeholder="文章标题" value="' + titleValue + '">' +
        '<textarea id="editContent" placeholder="' + placeholderText + '">' + contentValue + '</textarea>' +
        '<div style="margin-top:1rem;display:flex;gap:0.8rem;">' +
        '<button class="btn" id="saveBtn">' + (isEdit ? '💾 保存修改' : '📤 发布') + '</button>' +
        '<button class="btn btn-secondary" id="cancelEditBtn">取消</button></div></div>';
      
      document.getElementById('saveBtn').addEventListener('click', function() {
        var title = document.getElementById('editTitle').value.trim();
        var content = document.getElementById('editContent').value.trim();
        if (!title || !content) { showMessage('error', '请填写标题和内容'); return; }
        if (isEdit) { updatePost(issueNumber, title, content); } else { publishPost(title, content); }
      });
      
      document.getElementById('cancelEditBtn').addEventListener('click', function() {
        if (isEdit) { showPost(issueNumber); } else { loadPosts(); }
      });
    }

    function showNewPost() {
      if (!isConfigured()) { showMessage('error', '请先配置 GitHub 信息'); showConfig(); return; }
      showEditor(null, null);
    }

    async function editPost(issueNumber) {
      try {
        var issue = await githubRequest('GET', '/repos/' + config.owner + '/' + config.repo + '/issues/' + issueNumber);
        showEditor(issueNumber, { title: issue.title, body: issue.body });
      } catch (error) {
        showMessage('error', error.message);
      }
    }

    // ==================== 发布/更新/删除 ====================
    async function publishPost(title, content) {
      try {
        await githubRequest('POST', '/repos/' + config.owner + '/' + config.repo + '/issues', { title: title, body: content, labels: [LABEL_PREFIX] });
        showMessage('success', '文章发布成功！');
        loadPosts();
      } catch (error) {
        showMessage('error', '发布失败: ' + error.message);
      }
    }

    async function updatePost(issueNumber, title, content) {
      try {
        await githubRequest('PATCH', '/repos/' + config.owner + '/' + config.repo + '/issues/' + issueNumber, { title: title, body: content });
        showMessage('success', '文章已更新');
        showPost(issueNumber);
      } catch (error) {
        showMessage('error', '更新失败: ' + error.message);
      }
    }

    async function deletePost(issueNumber, issueTitle) {
      if (!confirm('确定要删除文章「' + issueTitle + '」吗？')) return;
      
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">正在删除...</div>';
      
      try {
        var response = await fetch(GITHUB_API + '/repos/' + config.owner + '/' + config.repo + '/issues/' + issueNumber, {
          method: 'DELETE',
          headers: {
            'Authorization': 'token ' + config.token,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (response.status === 204) {
          showMessage('success', '文章已删除');
          setTimeout(loadPosts, 2000);
        } else {
          throw new Error('删除失败: ' + response.status);
        }
      } catch (error) {
        showMessage('error', '删除失败: ' + error.message);
        loadPosts();
      }
    }

    // ==================== 初始化 ====================
    window.addEventListener('DOMContentLoaded', function() {
      console.log('页面加载完成');
      
      document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
      document.getElementById('cancelConfigBtn').addEventListener('click', hideConfig);
      document.getElementById('logoBtn').addEventListener('click', loadPosts);
      document.getElementById('homeBtn').addEventListener('click', function(e) { e.preventDefault(); loadPosts(); });
      document.getElementById('newPostNavBtn').addEventListener('click', function(e) { e.preventDefault(); showNewPost(); });
      document.getElementById('settingsNavBtn').addEventListener('click', function(e) { e.preventDefault(); showConfig(); });
      
      loadPosts();
    });
  </script>
</body>
</html>
