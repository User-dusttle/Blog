<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirage_Rover · OI Blog</title>
  <!-- 引入 marked.js 用于 Markdown 渲染 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.7;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    /* 配置面板 */
    #configPanel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }
    #configPanel.active { display: block; }
    #configPanel h2 { margin-bottom: 1rem; font-size: 1.2rem; color: var(--accent); }
    .config-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .config-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      min-width: 200px;
    }
    .config-row input:focus { outline: none; border-color: var(--accent); }

    /* 按钮 */
    .btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
      display: inline-block;
    }
    .btn:hover { opacity: 0.85; }
    .btn-secondary {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--text-secondary); }
    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }
    .btn-danger:hover { background: var(--red); color: white; }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo { font-size: 1.6rem; font-weight: 700; }
    .logo span { color: var(--accent); }
    .header-actions { display: flex; gap: 0.8rem; }

    /* 文章卡片 */
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .post-card:hover { border-color: var(--accent); }
    .post-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
    .post-meta { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .post-preview { color: var(--text-secondary); font-size: 0.9rem; }

    /* 文章详情 */
    .post-detail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .post-detail h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    .post-detail .markdown-body {
      margin-top: 1.5rem;
      line-height: 1.8;
    }
    .post-detail .markdown-body pre {
      background: #0b0f14;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1rem 0;
    }
    .post-detail .markdown-body code {
      background: #0b0f14;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .post-detail .markdown-body pre code {
      background: none;
      padding: 0;
    }

    /* 编辑器 */
    .editor {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .editor input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .editor textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      min-height: 300px;
      resize: vertical;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      line-height: 1.6;
    }
    .editor input:focus, .editor textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .hidden { display: none; }
    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); }
    .error-msg { background: #2d1518; border: 1px solid var(--red); color: #ffb3b3; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .success-msg { background: #12261e; border: 1px solid var(--green); color: #7ee2a8; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 配置面板 -->
    <div id="configPanel">
      <h2>⚙️ 博客配置</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1rem;">配置 GitHub 仓库信息以启用云端存储</p>
      <div class="config-row">
        <input type="text" id="configOwner" placeholder="GitHub 用户名 (如 User-dusttle)">
      </div>
      <div class="config-row">
        <input type="text" id="configRepo" placeholder="仓库名 (如 Blog)">
      </div>
      <div class="config-row">
        <input type="password" id="configToken" placeholder="GitHub Token (需要 repo 权限)">
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn" id="saveConfigBtn">💾 保存配置</button>
        <button class="btn btn-secondary" id="cancelConfigBtn">取消</button>
      </div>
    </div>

    <!-- 头部 -->
    <header class="header">
      <div class="logo">🌿 Mirage<span>_Rover</span> · OI Blog</div>
      <div class="header-actions">
        <button class="btn" id="newPostBtn">✏️ 写文章</button>
        <button class="btn btn-secondary" id="settingsBtn">⚙️ 设置</button>
      </div>
    </header>

    <!-- 消息区域 -->
    <div id="messageArea"></div>

    <!-- 内容区域 -->
    <div id="contentArea"></div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let config = {
      owner: localStorage.getItem('oi_blog_owner') || '',
      repo: localStorage.getItem('oi_blog_repo') || '',
      token: localStorage.getItem('oi_blog_token') || ''
    };
    const GITHUB_API = 'https://api.github.com';
    const LABEL_PREFIX = 'blog-post';

    // ==================== 工具函数 ====================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showMessage(type, message) {
      const area = document.getElementById('messageArea');
      const cls = type === 'error' ? 'error-msg' : 'success-msg';
      area.innerHTML = `<div class="${cls}">${escapeHtml(message)}</div>`;
      setTimeout(() => { area.innerHTML = ''; }, 3000);
    }

    function renderMarkdown(text) {
      if (typeof marked !== 'undefined') {
        // 使用 marked 渲染 Markdown
        marked.setOptions({
          breaks: true,
          gfm: true,
          highlight: function(code, lang) {
            return code;
          }
        });
        return marked.parse(text);
      } else {
        // 降级方案：简单转义
        return escapeHtml(text).replace(/\n/g, '<br>');
      }
    }

    // ==================== 配置管理 ====================
    function showConfig() {
      document.getElementById('configPanel').classList.add('active');
      document.getElementById('configOwner').value = config.owner;
      document.getElementById('configRepo').value = config.repo;
      document.getElementById('configToken').value = config.token;
    }

    function hideConfig() {
      document.getElementById('configPanel').classList.remove('active');
    }

    function saveConfig() {
      config.owner = document.getElementById('configOwner').value.trim();
      config.repo = document.getElementById('configRepo').value.trim();
      config.token = document.getElementById('configToken').value.trim();
      
      if (!config.owner || !config.repo || !config.token) {
        showMessage('error', '请填写完整信息');
        return;
      }
      
      localStorage.setItem('oi_blog_owner', config.owner);
      localStorage.setItem('oi_blog_repo', config.repo);
      localStorage.setItem('oi_blog_token', config.token);
      hideConfig();
      showMessage('success', '配置已保存');
      loadPosts();
    }

    // ==================== GitHub API ====================
    async function githubRequest(method, endpoint, body = null) {
      if (!config.owner || !config.repo || !config.token) {
        throw new Error('请先配置 GitHub 信息');
      }
      const url = `${GITHUB_API}${endpoint}`;
      const headers = {
        'Authorization': `token ${config.token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };
      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);
      
      const response = await fetch(url, options);
      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.message || `GitHub API 错误: ${response.status}`);
      }
      return response.json();
    }

    // ==================== 文章加载 ====================
    async function loadPosts() {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '<div class="loading">加载中...</div>';
      
      try {
        const issues = await githubRequest('GET', 
          `/repos/${config.owner}/${config.repo}/issues?state=open&labels=${LABEL_PREFIX}&per_page=100`
        );
        
        if (issues.length === 0) {
          contentArea.innerHTML = '<div class="loading">暂无文章，点击「✏️ 写文章」开始记录</div>';
          return;
        }
        
        contentArea.innerHTML = issues.map(issue => {
          const preview = issue.body ? 
            issue.body.replace(/```[\s\S]*?```/g, '[代码块]').replace(/[#>*`\n]/g, ' ').slice(0, 150) + '...' : '';
          
          return `
            <div class="post-card" data-issue-number="${issue.number}">
              <div class="post-title">${escapeHtml(issue.title)}</div>
              <div class="post-meta">
                #${issue.number} | ${new Date(issue.created_at).toLocaleDateString('zh-CN')}
              </div>
              <div class="post-preview">${escapeHtml(preview)}</div>
            </div>
          `;
        }).join('');
        
        // 绑定文章点击事件
        document.querySelectorAll('.post-card').forEach(card => {
          card.addEventListener('click', function() {
            const issueNumber = this.getAttribute('data-issue-number');
            showPost(issueNumber);
          });
        });
      } catch (error) {
        contentArea.innerHTML = `<div class="error-msg">${escapeHtml(error.message)}</div>`;
      }
    }

    async function showPost(issueNumber) {
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = '<div class="loading">加载中...</div>';
      
      try {
        const issue = await githubRequest('GET', 
          `/repos/${config.owner}/${config.repo}/issues/${issueNumber}`
        );
        
        const renderedContent = renderMarkdown(issue.body || '');
        
        contentArea.innerHTML = `
          <div class="post-detail">
            <button class="btn btn-secondary" id="backBtn">← 返回</button>
            <h1>${escapeHtml(issue.title)}</h1>
            <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem;">
              #${issue.number} | 创建于 ${new Date(issue.created_at).toLocaleDateString('zh-CN')}
              ${issue.updated_at !== issue.created_at ? ` | 更新于 ${new Date(issue.updated_at).toLocaleDateString('zh-CN')}` : ''}
            </div>
            <div class="markdown-body">${renderedContent}</div>
            <div style="margin-top: 2rem; display: flex; gap: 0.8rem;">
              <button class="btn btn-secondary" id="editBtn">✏️ 编辑</button>
              <button class="btn btn-danger" id="deleteBtn">🗑️ 删除</button>
            </div>
          </div>
        `;
        
        document.getElementById('backBtn').addEventListener('click', loadPosts);
        document.getElementById('editBtn').addEventListener('click', () => editPost(issueNumber));
        document.getElementById('deleteBtn').addEventListener('click', () => deletePost(issueNumber, issue.title));
        
      } catch (error) {
        contentArea.innerHTML = `<div class="error-msg">${escapeHtml(error.message)}</div>`;
      }
    }

    function showEditor(issueNumber = null, existingData = null) {
      const contentArea = document.getElementById('contentArea');
      const isEdit = issueNumber !== null;
      
      contentArea.innerHTML = `
        <div class="editor">
          <h2 style="margin-bottom: 1rem;">${isEdit ? '✏️ 编辑文章 #' + issueNumber : '✏️ 撰写新文章'}</h2>
          <input type="text" id="editTitle" placeholder="文章标题" value="${existingData ? escapeHtml(existingData.title) : ''}">
          <textarea id="editContent" placeholder="支持 Markdown 语法&#10;&#10;# 标题&#10;## 子标题&#10;**加粗** *斜体*&#10;&#10;```cpp&#10;代码块&#10;```">${existingData ? escapeHtml(existingData.body) : ''}</textarea>
          <div style="margin-top: 1rem; display: flex; gap: 0.8rem;">
            <button class="btn" id="saveBtn">${isEdit ? '💾 保存修改' : '📤 发布'}</button>
            <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
          </div>
        </div>
      `;
      
      document.getElementById('saveBtn').addEventListener('click', () => {
        const title = document.getElementById('editTitle').value.trim();
        const content = document.getElementById('editContent').value.trim();
        
        if (!title || !content) {
          showMessage('error', '请填写标题和内容');
          return;
        }
        
        if (isEdit) {
          updatePost(issueNumber, title, content);
        } else {
          publishPost(title, content);
        }
      });
      
      document.getElementById('cancelEditBtn').addEventListener('click', () => {
        if (isEdit) {
          showPost(issueNumber);
        } else {
          loadPosts();
        }
      });
    }

    function showNewPost() {
      if (!config.owner || !config.repo || !config.token) {
        showMessage('error', '请先配置 GitHub 信息');
        showConfig();
        return;
      }
      showEditor();
    }

    async function editPost(issueNumber) {
      try {
        const issue = await githubRequest('GET', 
          `/repos/${config.owner}/${config.repo}/issues/${issueNumber}`
        );
        showEditor(issueNumber, { title: issue.title, body: issue.body });
      } catch (error) {
        showMessage('error', error.message);
      }
    }

    async function publishPost(title, content) {
      try {
        await githubRequest('POST', 
          `/repos/${config.owner}/${config.repo}/issues`,
          { title, body: content, labels: [LABEL_PREFIX] }
        );
        showMessage('success', '文章发布成功！');
        loadPosts();
      } catch (error) {
        showMessage('error', '发布失败: ' + error.message);
      }
    }

    async function updatePost(issueNumber, title, content) {
      try {
        await githubRequest('PATCH', 
          `/repos/${config.owner}/${config.repo}/issues/${issueNumber}`,
          { title, body: content }
        );
        showMessage('success', '文章已更新');
        showPost(issueNumber);
      } catch (error) {
        showMessage('error', '更新失败: ' + error.message);
      }
    }

    async function deletePost(issueNumber, issueTitle) {
      if (!confirm(`确定要删除文章「${issueTitle}」吗？\n此操作将永久删除，不可恢复！`)) {
        return;
      }
      
      try {
        // 使用 DELETE 端点彻底删除 issue
        const response = await fetch(`${GITHUB_API}/repos/${config.owner}/${config.repo}/issues/${issueNumber}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${config.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (response.status === 204) {
          showMessage('success', '文章已永久删除');
          loadPosts();
        } else {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `删除失败: ${response.status}`);
        }
      } catch (error) {
        showMessage('error', '删除失败: ' + error.message);
      }
    }

    // ==================== 初始化 ====================
    window.addEventListener('DOMContentLoaded', function() {
      console.log('页面加载完成');
      
      // 绑定设置按钮
      document.getElementById('settingsBtn').addEventListener('click', function() {
        console.log('设置按钮被点击');
        showConfig();
      });
      
      // 绑定写文章按钮
      document.getElementById('newPostBtn').addEventListener('click', function() {
        console.log('写文章按钮被点击');
        showNewPost();
      });
      
      // 绑定保存配置按钮
      document.getElementById('saveConfigBtn').addEventListener('click', saveConfig);
      
      // 绑定取消配置按钮
      document.getElementById('cancelConfigBtn').addEventListener('click', hideConfig);
      
      // 检查是否已配置
      if (config.owner && config.repo && config.token) {
        loadPosts();
      } else {
        document.getElementById('contentArea').innerHTML = `
          <div class="loading">
            <p style="margin-bottom: 1rem;">👋 欢迎使用 OI Blog</p>
            <p style="font-size: 0.9rem; margin-bottom: 1rem;">请先配置 GitHub 信息以启用云端存储</p>
            <button class="btn" id="startConfigBtn">⚙️ 开始配置</button>
          </div>
        `;
        document.getElementById('startConfigBtn').addEventListener('click', showConfig);
      }
    });
  </script>
</body>
</html>
