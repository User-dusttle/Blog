<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mirage_Rover · OI Blog</title>
  <!-- Markdown 渲染 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <!-- 代码高亮 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a212b;
      --surface-hover: #212b36;
      --border: #2c3643;
      --text: #d6e1f0;
      --text-secondary: #9aa8bc;
      --accent: #4f9cf7;
      --accent-soft: #1e3a5f;
      --green: #5cb87a;
      --red: #e06c75;
      --code-bg: #0b0f14;
      --radius: 16px;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.65;
      padding: 1.2rem 1rem 2rem;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .blog-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .site-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.1rem 2rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.5s ease;
    }
    .logo-area { display: flex; align-items: center; gap: 0.7rem; cursor: pointer; user-select: none; transition: transform 0.3s ease; }
    .logo-area:hover { transform: scale(1.03); }
    .logo-icon { font-size: 2rem; animation: bounce 3s ease-in-out infinite; }
    .logo-text { font-size: 1.8rem; font-weight: 700; color: var(--text); }
    .logo-text span { color: var(--accent); }
    .logo-text em {
      font-style: normal;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.6rem;
      border-radius: 40px;
      font-size: 0.7em;
      margin-left: 6px;
    }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      padding: 0.3rem 0;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a:hover::after { width: 100%; }
    .nav-links a.active { color: var(--accent); font-weight: 600; }
    .nav-links a.active::after { width: 100%; }

    .btn {
      background: var(--accent);
      color: #0d1117;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      display: inline-block;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    .btn:hover::before { width: 300px; height: 300px; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 156, 247, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn-secondary { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--text-secondary); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: white; }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(270px, 1fr);
      gap: 1.8rem;
      align-items: start;
    }
    .post-list { display: flex; flex-direction: column; gap: 1.5rem; }
    .post-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 1.8rem 2rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      animation: fadeInUp 0.5s ease backwards;
    }
    .post-card:nth-child(1) { animation-delay: 0.05s; }
    .post-card:nth-child(2) { animation-delay: 0.1s; }
    .post-card:nth-child(3) { animation-delay: 0.15s; }
    .post-card:nth-child(4) { animation-delay: 0.2s; }
    .post-card:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transform: translateY(-4px) scale(1.01);
    }
    .post-meta { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-bottom: 0.8rem; }
    .post-date { font-size: 0.8rem; color: var(--text-secondary); }
    .post-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      background: var(--accent-soft);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .post-tag:hover { background: var(--accent); color: #0d1117; }
    .post-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; transition: color 0.3s ease; }
    .post-card:hover .post-title { color: var(--accent); }
    .post-excerpt { color: var(--text-secondary); font-size: 0.95rem; }

    .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    .sidebar-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .sidebar-card:hover { border-color: #3a4a5e; box-shadow: var(--shadow); transform: translateY(-2px); }
    .sidebar-card h3 { margin-bottom: 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; user-select: none; }
    .sidebar-card h3 .arrow { transition: transform 0.3s ease; display: inline-block; }
    .sidebar-card h3 .arrow.collapsed { transform: rotate(-90deg); }
    .author-box { text-align: center; }
    .avatar {
      width: 72px;
      height: 72px;
      background: linear-gradient(145deg, #1e3a5f, #2c4a6e);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 0.8rem;
      transition: all 0.4s ease;
    }
    .avatar:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 0 20px rgba(79, 156, 247, 0.3); }
    .author-name { font-weight: 700; font-size: 1.2rem; }
    .author-desc { color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.5rem; }

    .changelog { max-height: 300px; overflow-y: auto; transition: max-height 0.4s ease; }
    .changelog.collapsed { max-height: 0; overflow: hidden; }
    .changelog-item { padding: 0.8rem 0; border-bottom: 1px dashed var(--border); }
    .changelog-item:last-child { border-bottom: none; }
    .changelog-version { font-weight: 600; color: var(--accent); font-size: 0.9rem; margin-bottom: 0.3rem; }
    .changelog-date { font-size: 0.75rem; color: var(--text-secondary); }
    .changelog-desc { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.2rem; }

    .tag-cloud { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .post-detail {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      animation: fadeInUp 0.5s ease;
    }
    .post-detail h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    .markdown-body { margin-top: 1.5rem; line-height: 1.8; animation: fadeIn 0.5s ease; }
    .markdown-body pre {
      background: var(--code-bg);
      padding: 1.2rem;
      border-radius: 12px;
      overflow-x: auto;
      margin: 1rem 0;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }
    .markdown-body pre:hover { box-shadow: 0 0 15px rgba(79, 156, 247, 0.15); border-color: var(--accent); }
    .markdown-body code {
      background: var(--code-bg);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    .markdown-body pre code { background: none; padding: 0; font-size: 0.85rem; }
    .markdown-body a {
      color: #6cb2f7;
      text-decoration: none;
      border-bottom: 1px dashed rgba(108, 178, 247, 0.5);
      padding: 0 2px;
      transition: all 0.3s ease;
    }
    .markdown-body a:hover {
      color: #8ec5ff;
      border-bottom: 1px solid #8ec5ff;
      background: rgba(108, 178, 247, 0.15);
      border-radius: 4px;
      padding: 0 4px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 0.5rem 1rem;
      transition: all 0.3s ease;
    }
    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 156, 247, 0.1);
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 150px;
    }

    .editor {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      animation: fadeInUp 0.5s ease;
    }
    .editor input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    .editor textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 0.95rem;
      min-height: 300px;
      resize: vertical;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      line-height: 1.6;
    }
    .editor input:focus, .editor textarea:focus { outline: none; border-color: var(--accent); }

    .tag-input-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .tag-input-row input { flex: 1; min-width: 150px; margin-bottom: 0 !important; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .tag-chip {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .tag-chip .remove-tag { cursor: pointer; font-weight: bold; }
    .tag-chip .remove-tag:hover { color: var(--red); }

    .loading { text-align: center; padding: 3rem; color: var(--text-secondary); animation: pulse 2s ease-in-out infinite; }
    .error-msg { background: #2d1518; border: 1px solid var(--red); color: #ffb3b3; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    .success-msg { background: #12261e; border: 1px solid var(--green); color: #7ee2a8; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }

    .password-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .password-modal.active { display: flex; }
    .password-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      animation: fadeInUp 0.3s ease;
    }
    .password-box h2 { margin-bottom: 1rem; }
    .password-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .site-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
    }
    @media (max-width: 500px) {
      .post-card { padding: 1.2rem; }
      .post-title { font-size: 1.3rem; }
      .search-box input { width: 80px; }
    }
  </style>
</head>
<body>
  <div class="blog-container">
    <header class="site-header">
      <div class="logo-area" id="logoBtn">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Mirage<span>_Rover</span> <em>OI Blog</em></span>
      </div>
      <nav class="nav-links">
        <a id="homeBtn" class="active">🏠 首页</a>
        <a id="adminBtn">🔐 管理</a>
      </nav>
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="搜索文章...">
      </div>
    </header>

    <div id="messageArea"></div>

    <div class="main-grid">
      <main class="post-list" id="postList">
        <div class="loading">加载中...</div>
      </main>
      <aside class="sidebar">
        <div class="sidebar-card">
          <div class="author-box">
            <div class="avatar">🧑‍💻</div>
            <div class="author-name">Mirage_Rover</div>
            <p class="author-desc">OIer / 算法竞赛选手<br>分享题解与学习笔记</p>
          </div>
        </div>
        <div class="sidebar-card">
          <h3 id="changelogToggle"><span class="arrow">▼</span> 📋 更新日志</h3>
          <div class="changelog" id="changelogContent">
            <div class="changelog-item">
              <div class="changelog-version">v1.2.0</div>
              <div class="changelog-date">2025-08-20</div>
              <div class="changelog-desc">
                ✨ 新增代码高亮<br>
                🎨 优化代码块样式
              </div>
            </div>
            <div class="changelog-item">
              <div class="changelog-version">v1.1.0</div>
              <div class="changelog-date">2025-08-20</div>
              <div class="changelog-desc">
                ✨ 新增搜索功能<br>
                🏷️ 新增标签筛选<br>
                📂 更新日志折叠
              </div>
            </div>
            <div class="changelog-item">
              <div class="changelog-version">v1.0.0</div>
              <div class="changelog-date">2025-08-20</div>
              <div class="changelog-desc">
                ✨ 初始版本发布<br>
                📝 支持文章发布/编辑/删除<br>
                📐 支持 Markdown 渲染<br>
                🔢 支持 LaTeX 公式
              </div>
            </div>
          </div>
        </div>
        <div class="sidebar-card">
          <h3>🏷️ 标签筛选</h3>
          <div class="tag-cloud" id="tagCloud">
            <span class="loading" style="padding:1rem;">加载标签...</span>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="password-modal" id="passwordModal">
    <div class="password-box">
      <h2>🔐 管理员验证</h2>
      <input type="password" id="passwordInput" placeholder="管理密码">
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn" id="passwordConfirmBtn">确认</button>
        <button class="btn btn-secondary" id="passwordCancelBtn">取消</button>
      </div>
    </div>
  </div>

  <script>
    const PROXY_URL = 'https://wavy-donkey-4453.user-dusttle.deno.net';
    const ADMIN_PASSWORD = 'l20130213';
    const LABEL_PREFIX = 'blog-post';
    
    let isAdmin = false;
    let allPosts = [];
    let activeTag = null;
    let searchQuery = '';

    // 配置 marked 支持代码高亮
    if (typeof marked !== 'undefined' && typeof hljs !== 'undefined') {
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function(code, lang) {
          if (lang && hljs.getLanguage(lang)) {
            return hljs.highlight(code, { language: lang }).value;
          }
          return hljs.highlightAuto(code).value;
        }
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showMessage(type, message) {
      const area = document.getElementById('messageArea');
      const cls = type === 'error' ? 'error-msg' : 'success-msg';
      area.innerHTML = '<div class="' + cls + '">' + escapeHtml(message) + '</div>';
      setTimeout(function() { area.innerHTML = ''; }, 3000);
    }

    function renderMarkdown(text) {
      if (typeof marked !== 'undefined') {
        return marked.parse(text);
      }
      return escapeHtml(text).replace(/\n/g, '<br>');
    }

    async function proxyRequest(method, endpoint, body, useAdmin) {
      var url = PROXY_URL + endpoint;
      var headers = { 'Content-Type': 'application/json' };
      if (useAdmin) headers['Authorization'] = 'Bearer ' + ADMIN_PASSWORD;
      var options = { method: method, headers: headers };
      if (body) options.body = JSON.stringify(body);
      var response = await fetch(url, options);
      if (!response.ok) {
        var errData = await response.json().catch(function() { return {}; });
        throw new Error(errData.message || 'API 错误: ' + response.status);
      }
      return response.json();
    }

    async function loadPosts() {
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">加载中...</div>';
      try {
        var issues = await proxyRequest('GET', '/api/issues?state=open&labels=' + LABEL_PREFIX + '&per_page=100');
        allPosts = issues.filter(function(issue) {
          return issue.labels.some(function(label) { return label.name === LABEL_PREFIX; });
        });
        renderPosts();
        renderTagCloud();
      } catch (error) {
        listEl.innerHTML = '<div class="error-msg">' + escapeHtml(error.message) + '</div>';
      }
    }

    function renderPosts() {
      var listEl = document.getElementById('postList');
      var filteredPosts = allPosts;
      if (activeTag) {
        filteredPosts = filteredPosts.filter(function(issue) {
          return issue.labels.some(function(label) { return label.name === activeTag; });
        });
      }
      if (searchQuery) {
        var query = searchQuery.toLowerCase();
        filteredPosts = filteredPosts.filter(function(issue) {
          return issue.title.toLowerCase().includes(query) || 
                 (issue.body && issue.body.toLowerCase().includes(query));
        });
      }
      if (filteredPosts.length === 0) {
        listEl.innerHTML = '<div class="loading">暂无匹配文章</div>';
        return;
      }
      listEl.innerHTML = filteredPosts.map(function(issue) {
        var preview = issue.body ? issue.body.replace(/```[\s\S]*?```/g, '[代码]').replace(/[#>*`\n]/g, ' ').slice(0, 150) + '...' : '';
        var tags = issue.labels
          .filter(function(l) { return l.name !== LABEL_PREFIX; })
          .map(function(l) { return '<span class="post-tag" data-tag="' + l.name + '">' + escapeHtml(l.name) + '</span>'; })
          .join('');
        return '<article class="post-card" data-issue="' + issue.number + '">' +
          '<div class="post-meta"><span class="post-date">📅 ' + new Date(issue.created_at).toLocaleDateString('zh-CN') + '</span></div>' +
          '<h2 class="post-title">' + escapeHtml(issue.title) + '</h2>' +
          '<p class="post-excerpt">' + escapeHtml(preview) + '</p>' +
          (tags ? '<div class="post-meta" style="margin-top:0.5rem;">' + tags + '</div>' : '') +
          '</article>';
      }).join('');
      document.querySelectorAll('.post-card').forEach(function(card) {
        card.addEventListener('click', function(e) {
          if (e.target.classList.contains('post-tag')) {
            e.stopPropagation();
            activeTag = e.target.getAttribute('data-tag');
            renderPosts();
            renderTagCloud();
          } else {
            showPost(this.getAttribute('data-issue'));
          }
        });
      });
    }

    function renderTagCloud() {
      var tagCloud = document.getElementById('tagCloud');
      var allTags = {};
      allPosts.forEach(function(issue) {
        issue.labels.forEach(function(label) {
          if (label.name !== LABEL_PREFIX) {
            if (!allTags[label.name]) allTags[label.name] = 0;
            allTags[label.name]++;
          }
        });
      });
      var tagNames = Object.keys(allTags);
      if (tagNames.length === 0) {
        tagCloud.innerHTML = '<span style="color:var(--text-secondary);font-size:0.85rem;">暂无标签</span>';
        return;
      }
      tagCloud.innerHTML = tagNames.map(function(tag) {
        return '<span class="post-tag' + (activeTag === tag ? ' active' : '') + '" data-tag="' + tag + '" style="cursor:pointer;' + (activeTag === tag ? 'background:var(--accent);color:#0d1117;' : '') + '">' + escapeHtml(tag) + ' (' + allTags[tag] + ')</span>';
      }).join('');
      tagCloud.querySelectorAll('.post-tag').forEach(function(tag) {
        tag.addEventListener('click', function() {
          activeTag = this.getAttribute('data-tag');
          renderPosts();
          renderTagCloud();
        });
      });
    }

    async function showPost(issueNumber) {
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">加载文章...</div>';
      try {
        var issue = await proxyRequest('GET', '/api/issues/' + issueNumber);
        var content = renderMarkdown(issue.body || '');
        var tags = issue.labels
          .filter(function(l) { return l.name !== LABEL_PREFIX; })
          .map(function(l) { return '<span class="post-tag">' + escapeHtml(l.name) + '</span>'; })
          .join(' ');
        var adminButtons = isAdmin ? 
          '<div style="margin-top:2rem;display:flex;gap:0.8rem;">' +
          '<button class="btn btn-secondary" id="editBtn">✏️ 编辑</button>' +
          '<button class="btn btn-danger" id="deleteBtn">🗑️ 删除</button></div>' : '';
        listEl.innerHTML = '<div class="post-detail">' +
          '<button class="btn btn-secondary" id="backBtn">← 返回列表</button>' +
          '<h1>' + escapeHtml(issue.title) + '</h1>' +
          '<div class="post-meta" style="margin-bottom:1rem;">' +
          '<span class="post-date">📅 ' + new Date(issue.created_at).toLocaleDateString('zh-CN') + '</span>' +
          (tags ? '<span style="display:flex;gap:0.5rem;flex-wrap:wrap;">' + tags + '</span>' : '') +
          '</div>' +
          '<div class="markdown-body" id="markdownContent">' + content + '</div>' +
          adminButtons + '</div>';
        document.getElementById('backBtn').addEventListener('click', loadPosts);
        if (isAdmin) {
          document.getElementById('editBtn').addEventListener('click', function() { editPost(issueNumber); });
          document.getElementById('deleteBtn').addEventListener('click', function() { deletePost(issueNumber, issue.title); });
        }
        if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
          MathJax.typesetPromise([document.getElementById('markdownContent')]).catch(function() {});
        }
      } catch (error) {
        listEl.innerHTML = '<div class="error-msg">' + escapeHtml(error.message) + '</div>';
      }
    }

    function showPasswordModal() {
      document.getElementById('passwordModal').classList.add('active');
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordInput').focus();
    }
    function hidePasswordModal() {
      document.getElementById('passwordModal').classList.remove('active');
    }
    function verifyPassword() {
      var input = document.getElementById('passwordInput').value;
      if (input === ADMIN_PASSWORD) {
        isAdmin = true;
        hidePasswordModal();
        showMessage('success', '管理员验证成功');
        document.getElementById('adminBtn').textContent = '✏️ 写文章';
        loadPosts();
      } else {
        showMessage('error', '密码错误');
      }
    }

    function showEditor(issueNumber, existingData) {
      if (!isAdmin) { showPasswordModal(); return; }
      var listEl = document.getElementById('postList');
      var isEdit = issueNumber !== null && issueNumber !== undefined;
      var titleValue = existingData ? escapeHtml(existingData.title) : '';
      var contentValue = existingData ? escapeHtml(existingData.body) : '';
      var existingTags = existingData ? existingData.labels.filter(function(l) { return l.name !== LABEL_PREFIX; }).map(function(l) { return l.name; }) : [];
      listEl.innerHTML = '<div class="editor">' +
        '<h2 style="margin-bottom:1rem;">' + (isEdit ? '✏️ 编辑文章' : '✏️ 撰写新文章') + '</h2>' +
        '<input type="text" id="editTitle" placeholder="文章标题" value="' + titleValue + '">' +
        '<div class="tag-input-row">' +
        '<input type="text" id="tagInput" placeholder="添加标签（回车确认）">' +
        '<button class="btn btn-secondary" id="addTagBtn">添加</button>' +
        '</div>' +
        '<div class="tag-list" id="tagList"></div>' +
        '<textarea id="editContent" placeholder="支持 Markdown 和 LaTeX 公式">' + contentValue + '</textarea>' +
        '<div style="margin-top:1rem;display:flex;gap:0.8rem;">' +
        '<button class="btn" id="saveBtn">' + (isEdit ? '💾 保存修改' : '📤 发布') + '</button>' +
        '<button class="btn btn-secondary" id="cancelEditBtn">取消</button></div></div>';
      var currentTags = existingTags.slice();
      function renderTags() {
        var tagList = document.getElementById('tagList');
        tagList.innerHTML = currentTags.map(function(tag) {
          return '<span class="tag-chip">' + escapeHtml(tag) + ' <span class="remove-tag" data-tag="' + tag + '">×</span></span>';
        }).join('');
        tagList.querySelectorAll('.remove-tag').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var tagToRemove = this.getAttribute('data-tag');
            currentTags = currentTags.filter(function(t) { return t !== tagToRemove; });
            renderTags();
          });
        });
      }
      renderTags();
      function addTag() {
        var tagInput = document.getElementById('tagInput');
        var tag = tagInput.value.trim();
        if (tag && currentTags.indexOf(tag) === -1) {
          currentTags.push(tag);
          renderTags();
        }
        tagInput.value = '';
        tagInput.focus();
      }
      document.getElementById('addTagBtn').addEventListener('click', addTag);
      document.getElementById('tagInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); addTag(); }
      });
      document.getElementById('saveBtn').addEventListener('click', function() {
        var title = document.getElementById('editTitle').value.trim();
        var content = document.getElementById('editContent').value.trim();
        if (!title || !content) { showMessage('error', '请填写标题和内容'); return; }
        var labels = [LABEL_PREFIX].concat(currentTags);
        if (isEdit) { updatePost(issueNumber, title, content, labels); } else { publishPost(title, content, labels); }
      });
      document.getElementById('cancelEditBtn').addEventListener('click', function() {
        if (isEdit) { showPost(issueNumber); } else { loadPosts(); }
      });
    }

    async function editPost(issueNumber) {
      try {
        var issue = await proxyRequest('GET', '/api/issues/' + issueNumber);
        showEditor(issueNumber, issue);
      } catch (error) {
        showMessage('error', error.message);
      }
    }
    async function publishPost(title, content, labels) {
      try {
        await proxyRequest('POST', '/admin/issues', { title: title, body: content, labels: labels }, true);
        showMessage('success', '文章发布成功！');
        loadPosts();
      } catch (error) {
        showMessage('error', '发布失败: ' + error.message);
      }
    }
    async function updatePost(issueNumber, title, content, labels) {
      try {
        await proxyRequest('PATCH', '/admin/issues/' + issueNumber, { title: title, body: content, labels: labels }, true);
        showMessage('success', '文章已更新');
        showPost(issueNumber);
      } catch (error) {
        showMessage('error', '更新失败: ' + error.message);
      }
    }
    async function deletePost(issueNumber, issueTitle) {
      if (!confirm('确定要删除文章「' + issueTitle + '」吗？')) return;
      var listEl = document.getElementById('postList');
      listEl.innerHTML = '<div class="loading">正在删除...</div>';
      try {
        await proxyRequest('PATCH', '/admin/issues/' + issueNumber, { state: 'closed' }, true);
        showMessage('success', '文章已删除');
        loadPosts();
      } catch (error) {
        showMessage('error', '删除失败: ' + error.message);
        loadPosts();
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      document.getElementById('logoBtn').addEventListener('click', function() {
        activeTag = null;
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        loadPosts();
      });
      document.getElementById('homeBtn').addEventListener('click', function(e) {
        e.preventDefault();
        activeTag = null;
        searchQuery = '';
        document.getElementById('searchInput').value = '';
        loadPosts();
      });
      document.getElementById('adminBtn').addEventListener('click', function(e) {
        e.preventDefault();
        if (isAdmin) { showEditor(null, null); } else { showPasswordModal(); }
      });
      document.getElementById('passwordConfirmBtn').addEventListener('click', verifyPassword);
      document.getElementById('passwordCancelBtn').addEventListener('click', hidePasswordModal);
      document.getElementById('passwordInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') verifyPassword();
      });
      document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value.trim();
        renderPosts();
      });
      document.getElementById('changelogToggle').addEventListener('click', function() {
        var content = document.getElementById('changelogContent');
        var arrow = this.querySelector('.arrow');
        content.classList.toggle('collapsed');
        arrow.classList.toggle('collapsed');
      });
      loadPosts();
    });
  </script>
</body>
</html>
